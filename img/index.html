<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Elite</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="navbar">
            <img src="../img/logos.jpg" alt="Logo Barbería Elite" class="logo">
            <nav class="menu">
                <a href="#inicio">Inicio</a>
                <a href="#servicios">Servicios</a>
                <a href="#contacto">Contacto</a>
                <a href="#contacto" class="boton">Reservar cita</a>
            </nav>
        </div>
        <div class="hero" style="background-image: url('../img/images.jpg');">
            <h1>BARBERÍA ELITE</h1>
            <p>Estilo que habla por ti.</p>
        </div>
    </header>

    <section id="servicios">
        <h2>Nuestros servicios</h2>

        <div class="servicios">

            <div class="tarjeta">
                <img src="../img/images (3).jpg" alt="Corte clásico" class="img-servicio">
                <h3>Corte clásico</h3>
                <p>$20.000</p>
            </div>

            <div class="tarjeta">
                <img src="../img/atractivo-hombre-pensativo-esta-esperando-su-turno-cortarse-pelo-barberia-ocupada_613910-21489.avif" alt="Fade" class="img-servicio">
                <h3>Fade</h3>
                <p>$25.000</p>
            </div>

            <div class="tarjeta">
                <img src="../img/images (1).jpg" alt="Barba" class="img-servicio">
                <h3>Barba</h3>
                <p>$15.000</p>
            </div>

        </div>
    </section>

    <section id="contacto">
        <h2>Reserva tu cita</h2>
        <p>📍 Medellín, Colombia</p>
        <p>🕐 Lunes - Sábado: 9:00 AM - 7:00 PM</p>

        <button onclick="reservar()">Reservar por WhatsApp</button>
    </section>

    <footer>
        <img src="../img/logo-footer.jpg" alt="Logo Barbería Elite" class="logo-footer">
        <p>© 2026 Barbería Elite</p>
    </footer>

    <script src="../js/script.js"></script>

</body>
</html>
